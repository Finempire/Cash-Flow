name: CI — Cash-Flow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # PARALLEL JOB 1: Validate Prisma Schema
  # ─────────────────────────────────────────────────────────────────────────────
  prisma-validate:
    name: Validate Prisma Schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Prisma
        run: npm i prisma --no-save --legacy-peer-deps
      - name: Validate Schema
        run: npx prisma validate

  # ─────────────────────────────────────────────────────────────────────────────
  # PARALLEL JOB 2: Lint & Type Check (Step 1 of Build Pipeline)
  # ─────────────────────────────────────────────────────────────────────────────
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client (Required for types)
        run: npx prisma generate
      - name: TypeScript Type Check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint --if-present

  # ─────────────────────────────────────────────────────────────────────────────
  # SEQUENTIAL JOB 3: Build Next.js (Only runs if Lint & Type Check passes)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "postgresql://x:x@localhost:5432/x"
          NEXTAUTH_SECRET: "ci-placeholder"
          NEXTAUTH_URL: "http://localhost:3000"
          AUTH_SECRET: "ci-placeholder"
